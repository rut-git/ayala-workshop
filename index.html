<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אילה דורלכר – תכנון ועיצוב פנים</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #f3eee8, #fbf8f4, #efe8df);
            color: #3e352c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* כותרת עליונה */
        .top-header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        .top-header span {
            font-size: 1.3rem;
            letter-spacing: 8px;
            color: #9a8d80;
        }

        /* חלוקה לשניים */
        .split {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
        }

        .split > div {
            flex: 1 1 50%;
            min-width: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* צד ימין - שם ופרטי קשר */
        .contact-side {
            padding: 40px;
        }

        .contact-box {
            text-align: center;
        }

        .contact-box h1 {
            font-size: 3.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 14px;
        }

        .contact-box .role {
            font-size: 1.6rem;
            font-weight: 300;
            color: #5c5044;
            margin-bottom: 45px;
        }

        .contact-box div,
        .contact-box a {
            font-size: 1.35rem;
            color: #5c5044;
            text-decoration: none;
            display: block;
            margin: 12px 0;
            letter-spacing: 0.5px;
        }

        .contact-box a:hover {
            color: #b8a58f;
            text-decoration: underline;
        }

        /* צד שמאל - תמונה */
        .image-side {
            flex-direction: column;
            gap: 25px;
            padding: 40px;
        }

        .image-side img {
            width: 100%;
            max-width: 380px;
            max-height: 55vh;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.18);
        }

        .projects-btn {
            display: inline-block;
            padding: 18px 55px;
            border: none;
            border-radius: 40px;
            background: #cbbba8;
            color: white;
            font-size: 1.25rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            white-space: nowrap;
        }

        .projects-btn:hover {
            background: #b8a58f;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        /* מובייל - עמודה אחת */
        @media (max-width: 768px) {
            .split {
                flex-direction: column-reverse;
            }
            .contact-box h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <span>תיקיית עבודות</span>
    </div>

    <div class="split">

        <div class="contact-side">
            <div class="contact-box">
                <h1>אילה דורלכר</h1>
                <div class="role">תכנון ועיצוב פנים</div>
                <div>050-4171241</div>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=4171241a@gmail.com" target="_blank" rel="noopener">4171241a@gmail.com</a>
            </div>
        </div>

        <div class="image-side">
            <img src="mez/20240909_134059.jpg" alt="הדמיה">
            <a class="projects-btn" href="projects.html">לעוד פרויקטים והדמיות</a>
        </div>

    </div>

</body>
</html>
