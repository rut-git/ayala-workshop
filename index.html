<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אילה דורלכר – תכנון ועיצוב פנים</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3eee8, #fbf8f4, #efe8df);
            color: #3e352c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cover {
            text-align: center;
            max-width: 600px;
        }

        .cover .subtitle {
            display: block;
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: #9a8d80;
            margin-bottom: 14px;
        }

        .cover h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .role {
            font-size: 1.3rem;
            font-weight: 300;
            color: #5c5044;
            letter-spacing: 1px;
            margin-bottom: 50px;
        }

        .projects-btn {
            display: inline-block;
            padding: 16px 55px;
            border: none;
            border-radius: 40px;
            background: #cbbba8;
            color: white;
            font-size: 1.15rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 55px;
        }

        .projects-btn:hover {
            background: #b8a58f;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .contact {
            font-size: 1rem;
            color: #5c5044;
            letter-spacing: 0.5px;
        }

        .contact-title {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #9a8d80;
            margin-bottom: 14px;
        }

        .contact a {
            color: #5c5044;
            text-decoration: none;
            display: block;
            margin: 6px 0;
            transition: color 0.3s ease;
        }

        .contact a:hover {
            color: #b8a58f;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .cover h1 { font-size: 2.2rem; }
            .role { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="cover">
        <span class="subtitle">תיקיית עבודות</span>
        <h1>אילה דורלכר</h1>
        <div class="role">תכנון ועיצוב פנים</div>

        <a class="projects-btn" href="projects.html">פרויקטים</a>

        <div class="contact">
            <div class="contact-title">פרטי קשר</div>
            <div>050-4171241</div>
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=4171241a@gmail.com" target="_blank" rel="noopener">4171241a@gmail.com</a>
        </div>
    </div>

</body>
</html>
